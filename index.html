<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎉 Sorteo Especial 🎉</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .title {
            color: #4a5568;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            color: #718096;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 30px;
        }

        .input-label {
            display: block;
            color: #4a5568;
            font-size: 1.1rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .name-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 50px;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
            background: #f7fafc;
        }

        .name-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        .check-button {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
            margin-bottom: 20px;
        }

        .check-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(79, 172, 254, 0.6);
        }

        .check-button:active {
            transform: translateY(-1px);
        }

        .result {
            min-height: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .success-message {
            background: linear-gradient(135deg, #56ab2f 0%, #a8e6cf 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            font-size: 1.3rem;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(86, 171, 47, 0.4);
            animation: celebrate 0.8s ease-out;
        }

        .error-message {
            background: linear-gradient(135deg, #ff6b6b 0%, #ffa8a8 100%);
            color: white;
            padding: 15px;
            border-radius: 15px;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            animation: shake 0.5s ease-out;
        }

        .whatsapp-button {
            background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            text-decoration: none;
            display: block;
            margin-top: 20px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.6s ease-out forwards;
        }

        .whatsapp-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
        }

        .hidden {
            display: none;
        }

        @keyframes celebrate {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #f39c12;
            animation: confetti-fall 3s linear infinite;
            z-index: 1000;
        }

        @keyframes confetti-fall {
            0% { transform: translateY(-100vh) rotate(0deg); }
            100% { transform: translateY(100vh) rotate(360deg); }
        }

        .winner-names {
            color: #4a5568;
            font-size: 0.9rem;
            margin-top: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">🎉 ¡SORTEO ESPECIAL! 🎉</h1>
        <p class="subtitle">Ingresa tu nombre para verificar si eres el ganador</p>
        
        <div class="input-group">
            <label class="input-label" for="nameInput">Tu primer nombre:</label>
            <input type="text" id="nameInput" class="name-input" placeholder="Escribe tu nombre aquí..." autocomplete="off">
        </div>
        
        <button class="check-button" onclick="checkWinner()">
            🔍 Verificar si soy ganador
        </button>
        
        <div id="result" class="result"></div>
        
        <div class="winner-names">
            <p>💫 .... 💫</p>
        </div>
    </div>

    <script>
        // Lista de nombres ganadores (puedes modificar esta lista)
        const winnerNames = [
            'max', 'celita'
        ];

        function createConfetti() {
            const colors = ['#f39c12', '#e74c3c', '#3498db', '#2ecc71', '#9b59b6', '#f1c40f'];
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 3 + 's';
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                document.body.appendChild(confetti);
                
                setTimeout(() => {
                    confetti.remove();
                }, 5000);
            }
        }

        function checkWinner() {
            const nameInput = document.getElementById('nameInput');
            const result = document.getElementById('result');
            const name = nameInput.value.trim().toLowerCase();
            
            if (!name) {
                result.innerHTML = '<div class="error-message">⚠️ Por favor, ingresa tu nombre</div>';
                return;
            }
            
            if (winnerNames.includes(name)) {
                result.innerHTML = `
                    <div class="success-message">
                        🎊 ¡FELICITACIONES ${nameInput.value.toUpperCase()}! 🎊<br>
                        ¡Eres uno de nuestros ganadores!
                    </div>
                `;
                
                // Crear confetti
                createConfetti();
                
                // Agregar botón de WhatsApp después del mensaje
                setTimeout(() => {
                    const whatsappButton = document.createElement('a');
                    whatsappButton.href = `https://wa.me/51941436095?text=¡Hola! Soy ${nameInput.value} y acabo de verificar que soy ganador del sorteo. ¿Cómo puedo reclamar mi premio?`;
                    whatsappButton.className = 'whatsapp-button';
                    whatsappButton.target = '_blank';
                    whatsappButton.innerHTML = '📱 Contactanos por WhatsApp';
                    result.appendChild(whatsappButton);
                }, 500);
                
            } else {
                result.innerHTML = `
                    <div class="error-message">
                        😔 Lo siento ${nameInput.value}, tu nombre no está en la lista de ganadores esta vez.<br>
                        ¡Sigue participando en nuestros próximos sorteos!
                    </div>
                `;
            }
        }

        // Permitir verificar presionando Enter
        document.getElementById('nameInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkWinner();
            }
        });

        // Limpiar resultado cuando se empieza a escribir
        document.getElementById('nameInput').addEventListener('input', function() {
            document.getElementById('result').innerHTML = '';
        });
    </script>
</body>
</html>
